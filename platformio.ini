; PlatformIO Project Configuration File
;
; The firmware lives in firmware/ (see firmware/README.md). This file sits at the
; repo root so the PlatformIO VS Code extension picks the project up when the
; repo folder is opened; the [platformio] section points it at firmware/.
;
; Board: EV Controller v1 uses an RP2350B (QFN-80, 48 GPIO) with 16 MB QSPI
; flash and a 12 MHz crystal. "rpipico2" is the 30-GPIO RP2350A and would not
; expose GPIO30-47 (motor PWM, ADC current sense). The Solder Party Stamp XL
; variant is the stock earlephilhower RP2350B + 16 MB + 12 MHz definition, so it
; matches this board exactly; only the USB strings are overridden below.

[platformio]
default_envs = ev_controller
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

[env:ev_controller]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = solderparty_rp2350_stamp_xl
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 150000000L
board_upload.maximum_size = 16777216
board_build.arduino.earlephilhower.usb_manufacturer = Srijan
board_build.arduino.earlephilhower.usb_product = EV Controller 2027
monitor_speed = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wno-unused-function
lib_deps =
    finani/ICM42688@^1.1.0
